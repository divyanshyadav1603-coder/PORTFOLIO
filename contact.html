<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Divyansh Yadav</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <div class="bg-circle circle1"></div>
    <div class="bg-circle circle2"></div>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Divyansh</a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="education.html">Education</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>

            </ul>

            <div class="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </div>
        </nav>
    </header>

    <main class="contact-page">
        <section class="contact-header">
            <h1>Contact Me</h1>
            <p>
                I'd love to connect with you. Feel free to reach out
                 for collaborations, internships,or just to say hello.
            </p>
        </section>

        <section class ="glass-card contact-info">
            <div class="glass-card contact-info">
                <h2>Get In Touch</h2>

                <div class="info-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>India</span>
                </div>

                <div class="info-item">
                    <i class="social-links"></i>
                    <span>Frontend Developer</span>
                </div>

                <div class="social-links">
                    <a href="#" aria-label="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>

                    <a href="#" aria-label="LinkedIn">
                        <i class="fa-brands fa-linkedin"></i>
                    </a>

                    <a href="#" aria-label="X">
                        <i class="fa-brands fa-x-twitter"></i>
                    </a>
                </div>

        </div>

        <div class="glass-card contact-form">

            <h2>Send a Message</h2>

            <form>

                <input type="text" placeholder="Your Name" required >
                <input type="email" placeholder="Your Email" required >
                <input type="text" placeholder="subject">
                <textarea rows="6" placeholder="Your Message"></textarea>

                <button class="primary-btn" type="submit">
                    Send Message
                </button>
            </form>
        </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Divyansh Yadav. All Rights Reserved.</p>
    </footer>

    <button id="scrollTopBtn" title="Go to top">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <script src="js/script.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
